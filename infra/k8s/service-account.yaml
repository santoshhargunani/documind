# service-account.yaml
# ---------------------
# The Kubernetes half of the Workload Identity bridge. The Terraform
# binding (modules/workload_identity) granted this KSA's identity
# permission to impersonate the GCP service account — this manifest
# is what actually creates that KSA and links it via the required
# annotation.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: documind-app
  # MUST exactly match k8s_service_account_name from the Terraform
  # workload_identity module's variables (default: "documind-app") —
  # this name is literally embedded in the IAM binding's member string
  # (serviceAccount:PROJECT.svc.id.goog[NAMESPACE/KSA_NAME]) we created
  # in Step 8.3. A mismatch here means the binding silently doesn't
  # apply to this ServiceAccount at all.
  namespace: default
  # MUST match k8s_namespace from the same Terraform variables, for
  # the identical reason.
  annotations:
    iam.gke.io/gcp-service-account: documind-app@project-672c834c-460a-4d65-a9b.iam.gserviceaccount.com
    # THIS annotation is what actually activates Workload Identity for
    # pods running as this ServiceAccount. It tells GKE's metadata
    # server: "when a pod using this KSA asks for GCP credentials,
    # hand back a token for THIS GSA." Without this annotation, the
    # IAM binding we created in Terraform exists but has nothing on
    # the Kubernetes side pointing back to it — both halves are
    # required for Workload Identity to actually function.
    #
    # This value is exactly what `terraform output gsa_email` prints.
